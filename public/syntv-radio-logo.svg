<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 0 420 180" fill="none" role="img" aria-label="SYNTV RADIO logo">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .cyan { fill: #22C5E5; }
      .cyan-stroke { stroke: #22C5E5; }
      .white { fill: #FFFFFF; }
      .brand { font-family: 'Montserrat', 'Arial Black', 'Segoe UI', Arial, sans-serif; font-weight: 800; letter-spacing: 1px; }
      .radio { font-family: 'Montserrat', 'Arial', 'Segoe UI', Arial, sans-serif; font-weight: 700; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Left icon group -->
  <g filter="url(#glow)">
    <!-- Circular swoosh -->
    <path d="M95 24 A66 66 0 1 0 150 52" stroke="#22C5E5" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Broadcast arcs -->
    <path d="M58 46 C70 34 82 28 95 28" stroke="#22C5E5" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M44 34 C62 18 80 10 95 10" stroke="#22C5E5" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Microphone -->
  <g>
    <rect x="80" y="52" width="30" height="52" rx="15" fill="#22C5E5"/>
    <path d="M66 96 C66 114 79 127 95 127 C111 127 124 114 124 96" stroke="#22C5E5" stroke-width="6" stroke-linecap="round" fill="none"/>
    <line x1="95" y1="127" x2="95" y2="143" stroke="#22C5E5" stroke-width="6" stroke-linecap="round"/>
    <line x1="79" y1="143" x2="111" y2="143" stroke="#22C5E5" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Brand name -->
  <text x="190" y="92" class="brand" font-size="74" letter-spacing="1">
    <tspan fill="#FFFFFF">SYN</tspan><tspan fill="#22C5E5">TV</tspan>
  </text>

  <!-- Radio badge row -->
  <g transform="translate(190,112)">
    <!-- Left waveform -->
    <g fill="#22C5E5">
      <rect x="0" y="18" width="4" height="10" rx="2" opacity="0.7"/>
      <rect x="8" y="14" width="4" height="18" rx="2" opacity="0.85"/>
      <rect x="16" y="10" width="4" height="26" rx="2"/>
      <rect x="24" y="14" width="4" height="18" rx="2" opacity="0.85"/>
      <rect x="32" y="18" width="4" height="10" rx="2" opacity="0.7"/>
    </g>

    <!-- Rounded outline badge -->
    <g transform="translate(48,0)">
      <rect x="0" y="2" width="160" height="42" rx="21" stroke="#22C5E5" stroke-width="3" fill="none"/>
      <!-- Play button -->
      <circle cx="28" cy="23" r="11" fill="#22C5E5"/>
      <polygon points="25,17 25,29 35,23" fill="#080D13"/>
      <!-- RADIO text -->
      <text x="48" y="31" fill="#FFFFFF" font-family="'Montserrat','Arial','Segoe UI',Arial,sans-serif" font-weight="700" font-size="27" letter-spacing="3">RADIO</text>
    </g>

    <!-- Right waveform -->
    <g transform="translate(220,0)" fill="#22C5E5">
      <rect x="0" y="18" width="4" height="10" rx="2" opacity="0.7"/>
      <rect x="8" y="14" width="4" height="18" rx="2" opacity="0.85"/>
      <rect x="16" y="10" width="4" height="26" rx="2"/>
      <rect x="24" y="14" width="4" height="18" rx="2" opacity="0.85"/>
      <rect x="32" y="18" width="4" height="10" rx="2" opacity="0.7"/>
    </g>
  </g>
</svg>
